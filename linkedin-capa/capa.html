<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1584px; height: 396px; overflow: hidden; }
  .cover {
    position: relative; width: 1584px; height: 396px; overflow: hidden;
    background:
      radial-gradient(900px 420px at 88% 10%, rgba(56, 189, 248, 0.22), transparent 60%),
      radial-gradient(700px 380px at 55% 120%, rgba(129, 140, 248, 0.25), transparent 60%),
      linear-gradient(120deg, #050b1a 0%, #0b1530 45%, #0f1d3d 100%);
    font-family: "Avenir Next", "Helvetica Neue", sans-serif;
    color: #e6edf7;
  }
  svg.net { position: absolute; inset: 0; }
  .text {
    position: absolute; right: 90px; top: 50%; transform: translateY(-50%);
    width: 860px; text-align: right;
  }
  .kicker {
    font-size: 17px; letter-spacing: 6px; text-transform: uppercase;
    color: #7dd3fc; font-weight: 600; margin-bottom: 18px;
  }
  h1 {
    margin: 0; font-size: 54px; line-height: 1.12; font-weight: 700; letter-spacing: -0.5px;
  }
  h1 .hl {
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 .q { color: #94a3b8; font-weight: 500; }
  .bar {
    margin: 26px 0 0 auto; width: 120px; height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
  }
  .tags {
    margin-top: 18px; font-size: 18px; color: #94a3b8; letter-spacing: 1px; font-weight: 500;
  }
  .tags b { color: #cbd5e1; font-weight: 600; }
</style>
</head>
<body>
<div class="cover">
  <svg class="net" width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="1" fill="rgba(148,163,184,0.18)"/>
      </pattern>
      <linearGradient id="fade" x1="0" x2="1">
        <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/>
        <stop offset="1" stop-color="#a78bfa" stop-opacity="0.15"/>
      </linearGradient>
    </defs>
    <rect width="1584" height="396" fill="url(#grid)"/>
    <!-- rede IoT: trilhas estilo circuito à esquerda -->
    <g stroke="url(#fade)" stroke-width="1.6" fill="none">
      <path d="M0 70 H120 L160 110 H300 L340 70 H470"/>
      <path d="M0 150 H80 L120 190 H250 L290 230 H420 L460 190 H560"/>
      <path d="M40 0 V40 L80 80 H200 L240 40 H360 V0"/>
      <path d="M200 396 V330 L240 290 H380 L420 250 H520"/>
      <path d="M0 260 H60 L100 300 H160"/>
      <path d="M470 70 L520 120 H620"/>
      <path d="M560 190 L600 150 H680"/>
    </g>
    <g fill="#0b1530" stroke="#38bdf8" stroke-width="2">
      <circle cx="470" cy="70" r="6"/>
      <circle cx="620" cy="120" r="5"/>
      <circle cx="560" cy="190" r="6"/>
      <circle cx="680" cy="150" r="5"/>
      <circle cx="520" cy="250" r="6"/>
      <circle cx="360" cy="0" r="6"/>
      <circle cx="160" cy="300" r="5"/>
      <circle cx="300" cy="110" r="4"/>
      <circle cx="250" cy="190" r="4"/>
    </g>
    <g fill="#38bdf8">
      <circle cx="470" cy="70" r="2.5"/>
      <circle cx="560" cy="190" r="2.5"/>
      <circle cx="520" cy="250" r="2.5"/>
    </g>
    <!-- halos -->
    <g fill="none" stroke="rgba(56,189,248,0.25)">
      <circle cx="560" cy="190" r="16"/>
      <circle cx="560" cy="190" r="28" stroke="rgba(56,189,248,0.12)"/>
      <circle cx="470" cy="70" r="16"/>
    </g>
    <!-- arcos de sinal no canto direito -->
    <g fill="none" stroke="rgba(167,139,250,0.18)" stroke-width="2">
      <path d="M1584 346 a50 50 0 0 0 -50 50"/>
      <path d="M1584 316 a80 80 0 0 0 -80 80"/>
      <path d="M1584 286 a110 110 0 0 0 -110 110"/>
    </g>
  </svg>

  <div class="text">
    <div class="kicker">IoT · Automação · Segurança</div>
    <h1>Hoje é um belo dia para<br><span class="hl">fazer a diferença</span><span class="q">, não acha?</span></h1>
    <div class="bar"></div>
    <div class="tags"><b>Portal</b> e <b>Studio Unicontrol</b> &nbsp;·&nbsp; Home Assistant &nbsp;·&nbsp; ESPHome &nbsp;·&nbsp; Matter</div>
  </div>
</div>
</body>
</html>
